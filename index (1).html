<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Beon — Order Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d0d0f;--bg2:#141418;--bg3:#1c1c22;--bg4:#24242c;
    --border:#2e2e38;--border2:#3e3e4e;
    --text:#f0f0f5;--text2:#9999aa;--text3:#555566;
    --accent:#c8a96e;--accent2:#e8c98a;--accent-dim:#c8a96e22;
    --owner:#7c6bfa;--workshop:#4ea8de;--garment:#f06292;--receptor:#56cfab;
    --owner-dim:#7c6bfa22;--workshop-dim:#4ea8de22;--garment-dim:#f0629222;--receptor-dim:#56cfab22;
    --red:#f06060;--green:#56cfab;--yellow:#c8a96e;
    --r:10px;--r2:6px;
    font-family:'DM Sans',sans-serif;
  }
  body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

  /* SCROLLBAR */
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}


  /* LOADING */
  #loading{flex-direction:column;align-items:center;justify-content:center;background:var(--bg)}
  .loading-logo{font-family:'Syne',sans-serif;font-size:48px;font-weight:800;letter-spacing:-2px;color:var(--text);margin-bottom:20px}
  .loading-bar-wrap{width:200px;height:3px;background:var(--bg3);border-radius:3px;overflow:hidden}
  .loading-bar{height:100%;background:var(--accent);border-radius:3px;animation:loadanim 1.5s ease-in-out infinite}
  @keyframes loadanim{0%{width:0%;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0%;margin-left:100%}}
  .loading-status{font-size:13px;color:var(--text3);margin-top:14px}
  .btn-primary:disabled,.btn-submit:disabled{opacity:.6;cursor:default}

  /* SCREENS */
  .screen{display:none;min-height:100vh}
  .screen.active{display:flex}

  /* ===== LOGIN ===== */
  #login{flex-direction:column;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden}
  .login-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .login-bg::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,#c8a96e0a 0%,transparent 70%);top:-100px;left:-100px}
  .login-bg::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,#7c6bfa08 0%,transparent 70%);bottom:-80px;right:-80px}
  .login-card{position:relative;z-index:1;width:100%;max-width:420px;padding:0 20px}
  .login-logo{text-align:center;margin-bottom:48px}
  .login-logo .wordmark{font-family:'Syne',sans-serif;font-size:48px;font-weight:800;letter-spacing:-2px;color:var(--text);line-height:1}
  .login-logo .tagline{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--text3);margin-top:6px}
  .login-form-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:32px;box-shadow:0 0 60px #00000060}
  .login-form-box h2{font-size:18px;font-weight:500;margin-bottom:4px}
  .login-form-box p{font-size:13px;color:var(--text2);margin-bottom:28px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);margin-bottom:8px}
  .field input,.field select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px;font-family:inherit;font-size:14px;color:var(--text);outline:none;transition:border .2s}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .field select option{background:var(--bg3)}
  .btn-primary{width:100%;background:var(--accent);color:#0d0d0f;border:none;border-radius:var(--r2);padding:13px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s,transform .1s;letter-spacing:.3px}
  .btn-primary:hover{background:var(--accent2)}
  .btn-primary:active{transform:scale(.99)}
  .login-error{background:#f0606020;border:1px solid #f0606050;color:var(--red);font-size:13px;padding:10px 14px;border-radius:var(--r2);margin-bottom:16px;display:none}
  .login-roles{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .role-hint{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:10px 12px;cursor:pointer;transition:border .2s}
  .role-hint:hover{border-color:var(--border2)}
  .role-hint .rh-name{font-size:12px;font-weight:600}
  .role-hint .rh-pass{font-size:11px;color:var(--text3);margin-top:2px}
  .role-hint[data-role="owner"] .rh-name{color:var(--owner)}
  .role-hint[data-role="workshop"] .rh-name{color:var(--workshop)}
  .role-hint[data-role="garment"] .rh-name{color:var(--garment)}
  .role-hint[data-role="receptor"] .rh-name{color:var(--receptor)}

  /* ===== APP SHELL ===== */
  #app{flex-direction:column}
  .topbar{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;position:sticky;top:0;z-index:100}
  .topbar-logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;letter-spacing:-1px;color:var(--text);margin-right:8px}
  .topbar-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
  .topbar-role-badge{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:4px 10px;border-radius:20px}
  .role-owner .topbar-role-badge{background:var(--owner-dim);color:var(--owner)}
  .role-workshop .topbar-role-badge{background:var(--workshop-dim);color:var(--workshop)}
  .role-garment .topbar-role-badge{background:var(--garment-dim);color:var(--garment)}
  .role-receptor .topbar-role-badge{background:var(--receptor-dim);color:var(--receptor)}
  .topbar-user{font-size:13px;color:var(--text2)}
  .topbar-spacer{flex:1}
  .btn-logout{background:none;border:1px solid var(--border);border-radius:var(--r2);padding:7px 14px;font-family:inherit;font-size:12px;color:var(--text2);cursor:pointer;transition:all .2s}
  .btn-logout:hover{border-color:var(--border2);color:var(--text)}
  .topbar-notif{position:relative;background:none;border:1px solid var(--border);border-radius:var(--r2);width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:16px;transition:all .2s}
  .topbar-notif:hover{border-color:var(--border2);color:var(--text)}
  .notif-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--bg2);display:none}
  .notif-dot.visible{display:block}

  .main-layout{display:flex;flex:1;min-height:0}
  .sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);padding:16px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
  .sidebar-section{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);padding:12px 8px 6px;margin-top:8px}
  .sidebar-section:first-child{margin-top:0}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r2);font-size:13px;color:var(--text2);cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left}
  .nav-item:hover{background:var(--bg3);color:var(--text)}
  .nav-item.active{background:var(--bg4);color:var(--text);font-weight:500}
  .nav-item .nav-icon{width:18px;text-align:center;opacity:.7;font-size:15px}
  .nav-item.active .nav-icon{opacity:1}
  .nav-badge{margin-left:auto;font-size:10px;font-weight:600;background:var(--red);color:#fff;border-radius:10px;padding:2px 6px;min-width:18px;text-align:center}

  .content{flex:1;padding:28px 32px;overflow-y:auto}
  .page{display:none}
  .page.active{display:block}

  /* PAGE HEADER */
  .page-header{margin-bottom:28px}
  .page-header h1{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;letter-spacing:-1px}
  .page-header p{font-size:13px;color:var(--text2);margin-top:4px}

  /* STAT CARDS */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
  .stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}
  .stat-card .sc-label{font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
  .stat-card .sc-value{font-size:28px;font-weight:600;letter-spacing:-1px}
  .stat-card .sc-sub{font-size:12px;color:var(--text3);margin-top:4px}
  .stat-card.accent .sc-value{color:var(--accent)}
  .stat-card.blue .sc-value{color:var(--workshop)}
  .stat-card.pink .sc-value{color:var(--garment)}
  .stat-card.green .sc-value{color:var(--green)}

  /* ORDERS TABLE */
  .table-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .table-header h2{font-size:15px;font-weight:500;flex:1}
  .search-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:8px 14px;font-family:inherit;font-size:13px;color:var(--text);outline:none;transition:border .2s;width:200px}
  .search-input:focus{border-color:var(--accent)}
  .filter-select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:7px 12px;font-family:inherit;font-size:13px;color:var(--text2);outline:none;cursor:pointer}
  .filter-select:focus{border-color:var(--accent)}
  .filter-select option{background:var(--bg3)}
  .btn-new{background:var(--accent);color:#0d0d0f;border:none;border-radius:var(--r2);padding:8px 16px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
  .btn-new:hover{background:var(--accent2)}

  table{width:100%;border-collapse:collapse}
  .orders-table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
  thead th{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);padding:12px 16px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg3)}
  tbody tr{border-bottom:1px solid var(--border);transition:background .15s;cursor:pointer}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:var(--bg3)}
  td{padding:13px 16px;font-size:13px;color:var(--text2)}
  td.td-main{color:var(--text);font-weight:500}
  td.td-id{font-family:monospace;font-size:12px;color:var(--text3)}

  /* STATUS BADGES */
  .badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.3px;padding:3px 9px;border-radius:20px;text-transform:capitalize}
  .badge-pending{background:#c8a96e18;color:var(--yellow)}
  .badge-workshop{background:var(--workshop-dim);color:var(--workshop)}
  .badge-garment{background:var(--garment-dim);color:var(--garment)}
  .badge-done-workshop{background:#56cfab15;color:#56cfab}
  .badge-done-garment{background:#56cfab15;color:#56cfab}
  .badge-completed{background:#56cfab22;color:var(--green)}
  .badge-new{background:#c8a96e18;color:var(--yellow)}

  /* DEPT ICONS */
  .dept-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:20px;margin-right:4px}
  .dept-tag.workshop{background:var(--workshop-dim);color:var(--workshop)}
  .dept-tag.garment{background:var(--garment-dim);color:var(--garment)}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:#00000090;backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.open{display:flex}
  .modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px #00000080}
  .modal-header{padding:24px 28px 0;display:flex;align-items:flex-start;justify-content:space-between}
  .modal-header h2{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.5px}
  .modal-close{background:none;border:1px solid var(--border);border-radius:var(--r2);width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:16px;flex-shrink:0;transition:all .2s;margin-top:2px}
  .modal-close:hover{border-color:var(--border2);color:var(--text)}
  .modal-body{padding:20px 28px 28px}
  .modal-field{margin-bottom:16px}
  .modal-field label{display:block;font-size:12px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);margin-bottom:8px}
  .modal-field input,.modal-field select,.modal-field textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:11px 14px;font-family:inherit;font-size:13px;color:var(--text);outline:none;transition:border .2s}
  .modal-field input:focus,.modal-field select:focus,.modal-field textarea:focus{border-color:var(--accent)}
  .modal-field textarea{resize:vertical;min-height:80px;line-height:1.5}
  .modal-field select option{background:var(--bg3)}
  .checkbox-group{display:flex;gap:10px;flex-wrap:wrap}
  .checkbox-item{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:9px 14px;cursor:pointer;transition:border .2s;flex:1}
  .checkbox-item:hover{border-color:var(--border2)}
  .checkbox-item input{accent-color:var(--accent);width:15px;height:15px}
  .checkbox-item label{font-size:13px;cursor:pointer}
  .modal-actions{display:flex;gap:10px;margin-top:24px}
  .btn-cancel{flex:1;background:none;border:1px solid var(--border);border-radius:var(--r2);padding:11px;font-family:inherit;font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s}
  .btn-cancel:hover{border-color:var(--border2);color:var(--text)}
  .btn-submit{flex:2;background:var(--accent);color:#0d0d0f;border:none;border-radius:var(--r2);padding:11px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
  .btn-submit:hover{background:var(--accent2)}
  .btn-danger{flex:1;background:#f0606015;border:1px solid #f0606040;border-radius:var(--r2);padding:11px;font-family:inherit;font-size:13px;color:var(--red);cursor:pointer;transition:all .2s}
  .btn-danger:hover{background:#f0606025}

  /* ORDER DETAIL */
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  .detail-item .di-label{font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
  .detail-item .di-value{font-size:14px;color:var(--text)}
  .detail-divider{height:1px;background:var(--border);margin:20px 0}
  .dept-status-row{display:flex;gap:12px;margin-bottom:16px}
  .dept-status-card{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:14px;text-align:center}
  .dept-status-card .dsc-name{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .dept-status-card .dsc-name.workshop{color:var(--workshop)}
  .dept-status-card .dsc-name.garment{color:var(--garment)}
  .dept-status-card .dsc-badge{margin-bottom:10px}
  .btn-done{width:100%;background:var(--green);color:#0d0d0f;border:none;border-radius:var(--r2);padding:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
  .btn-done:hover{filter:brightness(1.1)}
  .btn-done:disabled{background:var(--bg4);color:var(--text3);cursor:default}

  /* NOTIFICATIONS */
  .notif-list{display:flex;flex-direction:column;gap:8px}
  .notif-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
  .notif-item.unread{border-color:var(--accent);background:var(--accent-dim)}
  .notif-dot2{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
  .notif-dot2.unread{background:var(--accent)}
  .notif-dot2.read{background:var(--text3)}
  .notif-content .nc-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px}
  .notif-content .nc-sub{font-size:12px;color:var(--text2)}
  .notif-content .nc-time{font-size:11px;color:var(--text3);margin-top:4px}

  /* USERS (owner) */
  .user-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;display:flex;align-items:center;gap:16px;margin-bottom:10px}
  .user-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
  .user-info{flex:1}
  .user-info .ui-name{font-size:14px;font-weight:500}
  .user-info .ui-role{font-size:12px;color:var(--text2);margin-top:2px}
  .user-info .ui-dept{font-size:11px;margin-top:4px}

  /* EMPTY STATE */
  .empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
  .empty-state .es-icon{font-size:40px;margin-bottom:16px;opacity:.3}
  .empty-state p{font-size:14px}

  /* TOAST */
  .toast{position:fixed;bottom:24px;right:24px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);padding:14px 20px;font-size:13px;color:var(--text);z-index:9999;transform:translateY(20px);opacity:0;transition:all .3s;pointer-events:none;max-width:300px}
  .toast.show{transform:translateY(0);opacity:1}
  .toast.success{border-color:#56cfab50;background:#56cfab15;color:var(--green)}
  .toast.error{border-color:#f0606050;background:#f0606015;color:var(--red)}

  @media(max-width:700px){
    .sidebar{display:none}
    .content{padding:16px}
    .stats-grid{grid-template-columns:1fr 1fr}
    .detail-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading" class="screen active">
  <div class="loading-logo">beon</div>
  <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
  <div class="loading-status" id="loading-status">Connecting to database…</div>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <div class="login-bg"></div>
  <div class="login-card">
    <div class="login-logo">
      <div class="wordmark">beon</div>
      <div class="tagline">Order Management System</div>
    </div>
    <div class="login-form-box">
      <h2>Sign in</h2>
      <p>Access your department dashboard</p>
      <div id="login-error" class="login-error">Invalid credentials. Try again.</div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-user" placeholder="Enter your email" autocomplete="username"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="Enter your password" autocomplete="current-password"/>
      </div>
      <button class="btn-primary" id="login-btn" onclick="doLogin()">Sign in →</button>

    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="screen">
  <div class="topbar">
    <div class="topbar-logo">beon</div>
    <div class="topbar-sep"></div>
    <span class="topbar-role-badge" id="topbar-role-badge">—</span>
    <span class="topbar-user" id="topbar-user">—</span>
    <div class="topbar-spacer"></div>
    <button class="topbar-notif" onclick="showPage('notifications')" title="Notifications">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <div class="notif-dot" id="notif-dot"></div>
    </button>
    <button class="btn-logout" onclick="doLogout()">Sign out</button>
  </div>
  <div class="main-layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- MODAL: New Order -->
<div class="modal-overlay" id="modal-new-order">
  <div class="modal">
    <div class="modal-header">
      <h2>New Order</h2>
      <button class="modal-close" onclick="closeModal('modal-new-order')">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-field"><label>Client Name</label><input type="text" id="no-client" placeholder="Full name"/></div>
      <div class="modal-field"><label>Phone</label><input type="text" id="no-phone" placeholder="+251 ..."/></div>
      <div class="modal-field"><label>Order Description</label><textarea id="no-desc" placeholder="Describe the order..."></textarea></div>
      <div class="modal-field"><label>Priority</label>
        <select id="no-priority">
          <option value="normal">Normal</option>
          <option value="urgent">Urgent</option>
        </select>
      </div>

<script>
// ===== SUPABASE =====
const SUPABASE_URL = 'https://hphgxiwgsstcgkucsmqe.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhwaGd4aXdnc3N0Y2drdWNzbXFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjcwNzcsImV4cCI6MjA5NjE0MzA3N30.noi9dSijdSxGdADw5B_opDBpGyjopWRAUg-S2HO4fr4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ===== IN-MEMORY STATE =====
let USERS = {};
let orders = [];
let notifications = [];
let currentUser = null;

// ===== DB HELPERS =====
async function dbFetchAll(){
  setLoadingStatus('Loading users…');
  const {data:users,error:ue}=await sb.from('users').select('*');
  if(ue){showLoadError('Failed to load users: '+ue.message);return false;}
  USERS={};
  (users||[]).forEach(u=>{USERS[u.email]={pass:u.pass,role:u.role,name:u.name,dept:u.dept};});

  setLoadingStatus('Loading orders…');
  const {data:ords,error:oe}=await sb.from('orders').select('*').order('created_at',{ascending:true});
  if(oe){showLoadError('Failed to load orders: '+oe.message);return false;}
  orders=(ords||[]).map(r=>({id:r.order_id,client:r.client,phone:r.phone||'',desc:r.description,priority:r.priority,departments:r.departments,status:r.status,workshopDone:r.workshop_done,garmentDone:r.garment_done,created:r.created_date,due:r.due_date||''}));

  setLoadingStatus('Loading notifications…');
  const {data:notifs,error:ne}=await sb.from('notifications').select('*').order('created_at',{ascending:true});
  if(ne){showLoadError('Failed to load notifications: '+ne.message);return false;}
  notifications=(notifs||[]).map(r=>({id:r.id,to:r.to_role,msg:r.msg,orderId:r.order_id,time:r.time_label,read:r.is_read}));
  return true;
}

async function dbInsertOrder(o){
  const {error}=await sb.from('orders').insert({order_id:o.id,client:o.client,phone:o.phone,description:o.desc,priority:o.priority,departments:o.departments,status:o.status,workshop_done:o.workshopDone,garment_done:o.garmentDone,created_date:o.created,due_date:o.due||null});
  if(error)showToast('DB error: '+error.message,'error');
  return !error;
}
async function dbUpdateOrder(id,fields){
  const map={};
  if(fields.status!==undefined)map.status=fields.status;
  if(fields.workshopDone!==undefined)map.workshop_done=fields.workshopDone;
  if(fields.garmentDone!==undefined)map.garment_done=fields.garmentDone;
  const {error}=await sb.from('orders').update(map).eq('order_id',id);
  if(error)showToast('DB error: '+error.message,'error');
  return !error;
}
async function dbDeleteOrder(id){
  await sb.from('notifications').delete().eq('order_id',id);
  const {error}=await sb.from('orders').delete().eq('order_id',id);
  if(error)showToast('DB error: '+error.message,'error');
  return !error;
}
async function dbInsertNotif(n){
  const {data,error}=await sb.from('notifications').insert({to_role:n.to,msg:n.msg,order_id:n.orderId,time_label:n.time,is_read:false}).select().single();
  if(!error&&data)n.id=data.id;
}
async function dbMarkNotifsRead(role){
  await sb.from('notifications').update({is_read:true}).eq('to_role',role).eq('is_read',false);
}
async function dbDeleteUser(email){
  const {error}=await sb.from('users').delete().eq('email',email);
  if(error)showToast('DB error: '+error.message,'error');
  return !error;
}

function setLoadingStatus(msg){document.getElementById('loading-status').textContent=msg;}
function showLoadError(msg){
  const el=document.getElementById('loading-status');
  el.textContent='⚠ '+msg+' (Check Supabase tables & refresh)';
  el.style.color='var(--red)';
}

// ===== BOOT =====
(async function boot(){
  const ok=await dbFetchAll();
  document.getElementById('loading').classList.remove('active');

  else{document.getElementById('loading').classList.add('active');}
})();


// State is loaded from Supabase (see boot above)

// ===== AUTH =====
function doLogin(){
  const u=document.getElementById('login-user').value.trim();
  const p=document.getElementById('login-pass').value.trim();
  const err=document.getElementById('login-error');
  if(USERS[u]&&USERS[u].pass===p){
    err.style.display='none';
    currentUser={username:u,...USERS[u]};
    showApp();
  } else {
    err.style.display='block';
  }
}
document.getElementById('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('login-user').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

function doLogout(){
  currentUser=null;
  document.getElementById('login').classList.add('active');
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-user').value='';
  document.getElementById('login-pass').value='';
}

// ===== APP =====
function showApp(){
  document.getElementById('login').classList.remove('active');
  document.getElementById('app').classList.add('active');
  const app = document.getElementById('app');
  app.className='screen active role-'+currentUser.role;
  document.getElementById('topbar-role-badge').textContent = currentUser.role;
  document.getElementById('topbar-user').textContent = currentUser.username;
  buildSidebar();
  updateNotifDot();
  showPage(defaultPage());
}

function defaultPage(){
  if(currentUser.role==='owner') return 'dashboard';
  if(currentUser.role==='receptor') return 'orders';
  return 'my-orders';
}

function buildSidebar(){
  const r=currentUser.role;
  const items = [];
  if(r==='owner'){
    items.push({section:'Overview'});
    items.push({id:'dashboard',icon:'grid',label:'Dashboard'});
    items.push({id:'all-orders',icon:'list',label:'All Orders'});
    items.push({section:'Management'});
    items.push({id:'users',icon:'users',label:'Users & Roles'});
    items.push({id:'reports',icon:'chart-bar',label:'Reports'});
  }
  if(r==='receptor'){
    items.push({section:'Orders'});
    items.push({id:'orders',icon:'list',label:'Active Orders'});
    items.push({id:'new-order',icon:'plus',label:'New Order',action:true});
    items.push({id:'completed',icon:'check',label:'Completed'});
  }
  if(r==='workshop'){
    items.push({section:'Workshop'});
    items.push({id:'my-orders',icon:'tool',label:'My Orders'});
  }
  if(r==='garment'){
    items.push({section:'Garment'});
    items.push({id:'my-orders',icon:'scissors',label:'My Orders'});
  }
  items.push({section:''});
  items.push({id:'notifications',icon:'bell',label:'Notifications',notif:true});

  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML='';
  items.forEach(item=>{
    if(item.section!==undefined){
      if(item.section) sidebar.innerHTML+=`<div class="sidebar-section">${item.section}</div>`;
      return;
    }
    const unread = item.notif ? notifications.filter(n=>n.to===currentUser.role&&!n.read).length : 0;
    const badge = unread>0 ? `<span class="nav-badge">${unread}</span>` : '';
    sidebar.innerHTML+=`<button class="nav-item" id="nav-${item.id}" onclick="${item.action?'openNewOrder()':'showPage(\''+item.id+'\')'}">
      <span class="nav-icon">${svgIcon(item.icon)}</span>${item.label}${badge}

  });
}

// ===== PAGES =====
let currentPage = '';
function showPage(id){
  currentPage=id;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const nav=document.getElementById('nav-'+id);
  if(nav) nav.classList.add('active');
  const content=document.getElementById('content');
  if(id==='dashboard') renderDashboard(content);
  else if(id==='all-orders') renderAllOrders(content);
  else if(id==='orders') renderOrders(content);
  else if(id==='completed') renderCompleted(content);
  else if(id==='my-orders') renderMyOrders(content);
  else if(id==='notifications') renderNotifications(content);
  else if(id==='users') renderUsers(content);
  else if(id==='reports') renderReports(content);
  if(id==='notifications'){
    notifications.filter(n=>n.to===currentUser.role).forEach(n=>n.read=true);
    dbMarkNotifsRead(currentUser.role);
    buildSidebar();
    updateNotifDot();
    document.getElementById('nav-notifications').classList.add('active');
  }
}

function updateNotifDot(){
  const unread=notifications.filter(n=>n.to===currentUser.role&&!n.read).length;
  document.getElementById('notif-dot').classList.toggle('visible',unread>0);
}

// ===== DASHBOARD (Owner) =====
function renderDashboard(el){
  const total=orders.length;
  const pending=orders.filter(o=>!['completed'].includes(o.status)).length;
  const done=orders.filter(o=>o.status==='completed').length;

  el.innerHTML=`
  <div class="page active">
    <div class="page-header"><h1>Dashboard</h1><p>Full system overview — all departments</p></div>
    <div class="stats-grid">
      <div class="stat-card accent"><div class="sc-label">Total Orders</div><div class="sc-value">${total}</div><div class="sc-sub">All time</div></div>
      <div class="stat-card blue"><div class="sc-label">In Progress</div><div class="sc-value">${pending}</div><div class="sc-sub">Active</div></div>
      <div class="stat-card green"><div class="sc-label">Completed</div><div class="sc-value">${done}</div><div class="sc-sub">Done</div></div>
      <div class="stat-card pink"><div class="sc-label">Urgent</div><div class="sc-value">${urgent}</div><div class="sc-sub">Need attention</div></div>
    </div>
    <div class="table-header"><h2>Recent Orders</h2></div>
    ${ordersTable(orders.slice().reverse(),'owner')}
  </div>`;

function renderAllOrders(el){
  el.innerHTML=`
  <div class="page active">
    <div class="page-header"><h1>All Orders</h1><p>Complete order history across all departments</p></div>
    <div class="table-header">
      <h2></h2>
      <input class="search-input" placeholder="Search client or ID…" oninput="filterTable(this.value)" id="search-all"/>
      <select class="filter-select" id="filter-status" onchange="filterTable(document.getElementById('search-all').value)">
        <option value="">All statuses</option>
        <option value="workshop">Workshop</option>
        <option value="garment">Garment</option>
        <option value="done-workshop">Workshop Done</option>
        <option value="done-garment">Garment Done</option>
        <option value="completed">Completed</option>
      </select>
    </div>
    <div id="all-orders-table">${ordersTable(orders.slice().reverse(),'owner')}</div>
  </div>`;
}
function filterTable(q){
  const status=document.getElementById('filter-status')?.value||'';
  const filtered=orders.filter(o=>{
    const matchQ=!q||(o.client.toLowerCase().includes(q.toLowerCase())||o.id.toLowerCase().includes(q.toLowerCase()));
    const matchS=!status||o.status===status;
    return matchQ&&matchS;
  });
  const t=document.getElementById('all-orders-table');
  if(t) t.innerHTML=ordersTable(filtered.slice().reverse(),'owner');
}

// ===== RECEPTOR ORDERS =====
function renderOrders(el){
  const active=orders.filter(o=>o.status!=='completed');
  el.innerHTML=`
  <div class="page active">
    <div class="page-header"><h1>Active Orders</h1><p>Orders in progress — track department status</p></div>
    <div class="table-header"><h2></h2>
      <button class="btn-new" onclick="openNewOrder()">+ New Order</button>
    </div>
    ${active.length ? ordersTable(active.slice().reverse(),'receptor') : emptyState('No active orders','All clear! Create a new order to get started.')}
  </div>`;
}
function renderCompleted(el){
  const done=orders.filter(o=>o.status==='completed');

  <div class="page active">
    <div class="page-header"><h1>Completed Orders</h1><p>Orders finished by all departments</p></div>

  </div>`;
}

// ===== NOTIFICATIONS =====
function renderNotifications(el){
  const mine=notifications.filter(n=>n.to===currentUser.role);

    <div class="notif-list">
    ${mine.length ? mine.slice().reverse().map(n=>`
      <div class="notif-item ${n.read?'':'unread'}">

}

// ===== USERS (Owner) =====
function renderUsers(el){
  el.innerHTML=`
  <div class="page active">
    <div class="page-header"><h1>Users & Roles</h1><p>Department access configuration</p></div>
    <div id="users-list">
    ${Object.entries(USERS).map(([u,d])=>`
    <div class="user-card" id="ucard-${CSS.escape(u)}">
      <div class="user-avatar" style="background:var(--${d.role}-dim);color:var(--${d.role})">${d.name[0]}</div>
      <div class="user-info">
        <div class="ui-name">${d.name}</div>
        <div class="ui-role">${u}</div>

    </div>`).join('')}
    </div>
  </div>`;
}
async function deleteUser(email){
  if(!confirm('Delete user '+email+'? This cannot be undone.')) return;
  const ok=await dbDeleteUser(email);
  if(ok){
    delete USERS[email];
    showToast('User '+email+' removed','success');
    renderUsers(document.getElementById('content'));
  }
}
function roleDesc(r){
  const m={owner:'Full access — all orders & management',receptor:'Creates orders & monitors departments',workshop:'Receives & completes workshop orders',garment:'Receives & completes garment orders'};
  return m[r]||'';
}

// ===== REPORTS (Owner) =====
function renderReports(el){
  const byDept={workshop:orders.filter(o=>o.departments.includes('workshop')).length,garment:orders.filter(o=>o.departments.includes('garment')).length};
  const wDone=orders.filter(o=>o.workshopDone).length;
  const gDone=orders.filter(o=>o.garmentDone).length;

  el.innerHTML=`
  <div class="page active">
    <div class="page-header"><h1>Reports</h1><p>Performance summary</p></div>
    <div class="stats-grid">
      <div class="stat-card blue"><div class="sc-label">Workshop orders</div><div class="sc-value">${byDept.workshop}</div><div class="sc-sub">${wDone} completed</div></div>
      <div class="stat-card pink"><div class="sc-label">Garment orders</div><div class="sc-value">${byDept.garment}</div><div class="sc-sub">${gDone} completed</div></div>
      <div class="stat-card green"><div class="sc-label">Fully completed</div><div class="sc-value">${completed}</div></div>
      <div class="stat-card accent"><div class="sc-label">Total</div><div class="sc-value">${orders.length}</div></div>
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-top:8px">
      <div style="font-size:13px;font-weight:500;margin-bottom:20px;color:var(--text2)">Order distribution</div>
      <div style="display:flex;flex-direction:column;gap:14px">
        ${reportBar('Workshop',byDept.workshop,orders.length,'var(--workshop)')}
        ${reportBar('Garment',byDept.garment,orders.length,'var(--garment)')}
        ${reportBar('Completed',completed,orders.length,'var(--green)')}
      </div>
    </div>
  </div>`;
}
function reportBar(label,val,total,color){
  const pct=total?Math.round(val/total*100):0;
  return `<div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:6px"><span>${label}</span><span>${val} (${pct}%)</span></div>
    <div style="background:var(--bg3);border-radius:4px;height:8px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${color};border-radius:4px;transition:width .6s"></div></div>
  </div>`;
}

function ordersTable(list,role){
  if(!list.length) return emptyState('No orders found','');
  const isOwner = role==='owner';
  return `<div class="orders-table-wrap">
  <table>
    <thead><tr>
      <th>ID</th><th>Client</th><th>Description</th><th>Depts</th><th>Priority</th><th>Status</th><th>Due</th>${isOwner?'<th></th>':''}
    </tr></thead>
    <tbody>${list.map(o=>`
    <tr onclick="openOrderDetail('${o.id}')">
      <td class="td-id">${o.id}</td>
      <td class="td-main">${o.client}</td>
      <td style="max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${o.desc}</td>
      <td>${o.departments.map(d=>`<span class="dept-tag ${d}">${d}</span>`).join('')}</td>
      <td><span class="badge ${o.priority==='urgent'?'badge-new':'badge-pending'}">${o.priority}</span></td>
      <td>${statusBadge(o)}</td>
      <td>${o.due||'—'}</td>
      ${isOwner?`<td onclick="event.stopPropagation()"><button class="btn-danger" style="padding:5px 10px;font-size:11px;white-space:nowrap" onclick="deleteOrder('${o.id}')">Delete</button></td>`:''}
    </tr>`).join('')}
    </tbody>
  </table></div>`;
}

function statusBadge(o){
  const labels={pending:'Pending',workshop:'At Workshop',garment:'At Garment','done-workshop':'Workshop ✓','done-garment':'Garment ✓',completed:'Completed'};
  const cls={pending:'badge-pending',workshop:'badge-workshop',garment:'badge-garment','done-workshop':'badge-done-workshop','done-garment':'badge-done-garment',completed:'badge-completed'};
  return `<span class="badge ${cls[o.status]||'badge-pending'}">${labels[o.status]||o.status}</span>`;
}

function emptyState(title,sub){
  return `<div class="empty-state"><div class="es-icon">○</div><p style="font-size:15px;font-weight:500;color:var(--text2);margin-bottom:6px">${title}</p><p>${sub}</p></div>`;
}

// ===== ORDER DETAIL MODAL =====
function openOrderDetail(id){
  const o=orders.find(x=>x.id===id);
  if(!o) return;
  document.getElementById('detail-title').textContent=o.id+' — '+o.client;
  const role=currentUser.role;
  const canMarkWorkshop=(role==='workshop'||role==='owner')&&o.departments.includes('workshop')&&!o.workshopDone;
  const canMarkGarment=(role==='garment'||role==='owner')&&o.departments.includes('garment')&&!o.garmentDone;

  let deptStatusHTML='';
  const depts=[];
  if(o.departments.includes('workshop')){
    depts.push(`<div class="dept-status-card">
      <div class="dsc-name workshop">Workshop</div>
      <div class="dsc-badge">${o.workshopDone?'<span class="badge badge-completed">Done ✓</span>':'<span class="badge badge-workshop">In progress</span>'}</div>
      <button class="btn-done" onclick="markDone('${id}','workshop')" ${o.workshopDone||(!canMarkWorkshop&&role!=='owner')?'disabled':''}>Mark Done</button>
    </div>`);
  }
  if(o.departments.includes('garment')){
    depts.push(`<div class="dept-status-card">
      <div class="dsc-name garment">Garment</div>
      <div class="dsc-badge">${o.garmentDone?'<span class="badge badge-completed">Done ✓</span>':'<span class="badge badge-garment">In progress</span>'}</div>
      <button class="btn-done" onclick="markDone('${id}','garment')" ${o.garmentDone||(!canMarkGarment&&role!=='owner')?'disabled':''}>Mark Done</button>
    </div>`);
  }
  if(depts.length) deptStatusHTML=`<div class="detail-divider"></div><div style="font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin-bottom:12px">Department Status</div><div class="dept-status-row">${depts.join('')}</div>`;

  document.getElementById('detail-body').innerHTML=`
  <div class="detail-grid">
    <div class="detail-item"><div class="di-label">Client</div><div class="di-value">${o.client}</div></div>
    <div class="detail-item"><div class="di-label">Phone</div><div class="di-value">${o.phone}</div></div>
    <div class="detail-item"><div class="di-label">Priority</div><div class="di-value"><span class="badge ${o.priority==='urgent'?'badge-new':'badge-pending'}">${o.priority}</span></div></div>
    <div class="detail-item"><div class="di-label">Due</div><div class="di-value">${o.due||'—'}</div></div>
    <div class="detail-item"><div class="di-label">Created</div><div class="di-value">${o.created}</div></div>
    <div class="detail-item"><div class="di-label">Status</div><div class="di-value">${statusBadge(o)}</div></div>
  </div>
  <div class="detail-item" style="margin-bottom:16px"><div class="di-label" style="font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px">Description</div>
    <div style="background:var(--bg3);border-radius:var(--r2);padding:14px;font-size:13px;color:var(--text2);line-height:1.6">${o.desc}</div>
  </div>
  ${deptStatusHTML}
  ${role==='owner'?`<div class="detail-divider"></div><div class="modal-actions"><button class="btn-danger" onclick="deleteOrder('${id}')">Delete Order</button><button class="btn-cancel" onclick="closeModal('modal-order-detail')">Close</button></div>`:''}
  `;
  openModal('modal-order-detail');
}

async function markDone(id,dept){
  const o=orders.find(x=>x.id===id);
  if(!o) return;
  if(dept==='workshop') o.workshopDone=true;
  if(dept==='garment') o.garmentDone=true;

  const wNeeded=o.departments.includes('workshop');
  const gNeeded=o.departments.includes('garment');
  const allDone=(!wNeeded||o.workshopDone)&&(!gNeeded||o.garmentDone);

  if(allDone) o.status='completed';
  else if(dept==='workshop') o.status='done-workshop';
  else o.status='done-garment';

  await dbUpdateOrder(id,{status:o.status,workshopDone:o.workshopDone,garmentDone:o.garmentDone});

  const deptName=dept==='workshop'?'Workshop':'Garment Dept';
  const now=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const n1={id:'',to:'receptor',msg:`${deptName} marked ${id} as Done`,orderId:id,time:'Today '+now,read:false};
  const n2={id:'',to:'owner',msg:`${deptName} completed ${id}`,orderId:id,time:'Today '+now,read:false};
  notifications.push(n1);notifications.push(n2);
  await dbInsertNotif(n1);await dbInsertNotif(n2);

  closeModal('modal-order-detail');
  showToast(`${deptName} marked as Done!`,'success');
  updateNotifDot();
  buildSidebar();
  showPage(currentPage);
}

async function deleteOrder(id){
  if(!confirm('Delete order '+id+'? This cannot be undone.')) return;
  const ok=await dbDeleteOrder(id);
  if(ok){
    orders=orders.filter(o=>o.id!==id);
    notifications=notifications.filter(n=>n.orderId!==id);
    closeModal('modal-order-detail');
    showToast('Order '+id+' deleted','success');
    buildSidebar();
    showPage(currentPage);
  }
}

// ===== NEW ORDER =====
function openNewOrder(){
  if(currentUser.role!=='receptor'&&currentUser.role!=='owner'){showToast('Only Receptor can create orders','error');return;}
  document.getElementById('no-client').value='';
  document.getElementById('no-phone').value='';
  document.getElementById('no-desc').value='';
  document.getElementById('no-priority').value='normal';
  document.getElementById('no-workshop').checked=false;
  document.getElementById('no-garment').checked=false;
  document.getElementById('no-date').value='';
  openModal('modal-new-order');
}

async function submitNewOrder(){
  const client=document.getElementById('no-client').value.trim();
  const phone=document.getElementById('no-phone').value.trim();
  const desc=document.getElementById('no-desc').value.trim();
  const priority=document.getElementById('no-priority').value;
  const wshop=document.getElementById('no-workshop').checked;
  const garm=document.getElementById('no-garment').checked;
  const date=document.getElementById('no-date').value;

  if(!client||!desc){showToast('Please fill client name & description','error');return;}
  if(!wshop&&!garm){showToast('Select at least one department','error');return;}

  const depts=[];
  if(wshop) depts.push('workshop');
  if(garm) depts.push('garment');

  const maxNum=orders.reduce((mx,o)=>{const n=parseInt(o.id.replace('ORD-',''),10);return isNaN(n)?mx:Math.max(mx,n);},0);
  const id='ORD-'+String(maxNum+1).padStart(3,'0');
  const today=new Date().toISOString().split('T')[0];
  const status=depts[0];

  const btn=document.getElementById('btn-submit-order');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}

  const newOrder={id,client,phone,desc,priority,departments:depts,status,workshopDone:false,garmentDone:false,created:today,due:date};
  const ok=await dbInsertOrder(newOrder);
  if(!ok){if(btn){btn.disabled=false;btn.textContent='Create Order →';}return;}
  orders.push(newOrder);

  const now=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  for(const d of depts){
    const n={id:'',to:d,msg:`New order ${id} from ${client}`,orderId:id,time:'Today '+now,read:false};
    notifications.push(n);await dbInsertNotif(n);
  }
  const nOwner={id:'',to:'owner',msg:`New order ${id} created by Receptor`,orderId:id,time:'Today '+now,read:false};
  notifications.push(nOwner);await dbInsertNotif(nOwner);

  if(btn){btn.disabled=false;btn.textContent='Create Order →';}
  closeModal('modal-new-order');
  showToast(`Order ${id} created & sent!`,'success');
  updateNotifDot();
  buildSidebar();
  showPage(currentPage);
}

// ===== MODALS =====
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
document.querySelectorAll('.modal-overlay').forEach(m=>{
  m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')});
});

// ===== TOAST =====
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast '+(type||'');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
</body>
